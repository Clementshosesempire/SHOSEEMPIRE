<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoes Empire — Sneakers authentiques à Cotonou</title>
<meta name="description" content="Shoes Empire — sneakers authentiques, livraison rapide à Cotonou. Commandez via WhatsApp, MTN MoMo, Moov Money ou Celtiis Cash.">
<meta name="theme-color" content="#0B0B0E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0E;
    --panel:#16161B;
    --panel-alt:#1E1E24;
    --line:#2B2B32;
    --text:#F2EFE9;
    --muted:#9A968C;
    --energy:#FF4322;
    --energy-dim:#C93516;
    --gold:#D6A94A;
    --mint:#4FD69C;
    --radius:4px;
    --maxw:1240px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Anton',sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    line-height:0.95;
    text-transform:uppercase;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  ul{list-style:none;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
  ::selection{background:var(--energy);color:#fff;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- HEADER ---------- */
  header{
    position:sticky;top:0;z-index:80;
    background:rgba(11,11,14,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;max-width:var(--maxw);margin:0 auto;
  }
  .logo{
    font-family:'Anton',sans-serif;
    font-size:22px;
    letter-spacing:0.02em;
    display:flex;align-items:center;gap:8px;
  }
  .logo span{color:var(--energy);}
  nav.mainnav{display:flex;gap:32px;}
  nav.mainnav a{
    font-size:14px;font-weight:600;color:var(--muted);
    transition:color .15s;
    padding-bottom:4px;border-bottom:2px solid transparent;
  }
  nav.mainnav a:hover,nav.mainnav a.active{color:var(--text);border-color:var(--energy);}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .icon-btn{
    width:40px;height:40px;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);
    position:relative;transition:border-color .15s;
  }
  .icon-btn:hover{border-color:var(--energy);}
  .cart-count{
    position:absolute;top:-6px;right:-6px;
    background:var(--energy);color:#fff;font-size:11px;font-weight:800;
    width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .burger{display:none;}
  @media(max-width:860px){
    nav.mainnav{display:none;}
    .burger{display:flex;}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:64px 0 0;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero-grid{
    max-width:var(--maxw);margin:0 auto;padding:0 24px;
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;
  }
  .eyebrow-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);
    padding:6px 14px;border-radius:100px;font-size:13px;font-weight:700;color:var(--gold);
    margin-bottom:22px;
  }
  .eyebrow-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);}
  .hero h1{font-size:clamp(42px,6.2vw,84px);}
  .hero h1 em{font-style:normal;color:var(--energy);}
  .hero p.lead{
    font-size:17px;color:var(--muted);max-width:46ch;margin-top:20px;
  }
  .hero-ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}
  .btn{
    padding:15px 28px;border-radius:var(--radius);font-weight:700;font-size:15px;
    display:inline-flex;align-items:center;gap:10px;transition:transform .12s, background .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--energy);color:#fff;}
  .btn-primary:hover{background:var(--energy-dim);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-ghost:hover{border-color:var(--text);}
  .btn-full{width:100%;justify-content:center;}
  .btn-sm{padding:10px 16px;font-size:13px;}

  .trust-row{
    display:flex;gap:28px;margin-top:44px;flex-wrap:wrap;
    padding-top:28px;border-top:1px solid var(--line);
  }
  .trust-item{display:flex;flex-direction:column;gap:2px;}
  .trust-item b{font-family:'Anton';font-size:26px;color:var(--text);}
  .trust-item span{font-size:12.5px;color:var(--muted);}

  .hero-visual{
    position:relative;aspect-ratio:1/1;
    background:linear-gradient(160deg,var(--panel-alt),var(--panel) 70%);
    border:1px solid var(--line);border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .hero-visual svg{width:78%;height:78%;}
  .hero-visual::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,67,34,0.18), transparent 55%);
  }
  .tread{
    position:absolute;bottom:0;left:0;right:0;height:64px;
    background-repeat:repeat-x;background-size:32px 100%;
    opacity:0.5;
    background-image:repeating-linear-gradient(115deg, var(--line) 0 4px, transparent 4px 16px);
  }
  @media(max-width:860px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-visual{order:-1;max-width:340px;margin:0 auto;}
  }

  /* ---------- SECTION HEADS ---------- */
  .section{padding:76px 0;}
  .section-head{
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
    margin-bottom:34px;flex-wrap:wrap;
  }
  .section-head h2{font-size:clamp(28px,4vw,42px);}
  .section-head p{color:var(--muted);font-size:14.5px;max-width:40ch;}

  /* ---------- FILTERS ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
  .filter-btn{
    padding:9px 18px;border:1px solid var(--line);border-radius:100px;font-size:13.5px;font-weight:600;color:var(--muted);
    transition:all .15s;
  }
  .filter-btn.active,.filter-btn:hover{border-color:var(--energy);color:var(--text);background:rgba(255,67,34,0.08);}
  .searchbar{
    display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 14px;margin-bottom:28px;max-width:420px;
  }
  .searchbar input{background:none;border:none;color:var(--text);font-family:inherit;font-size:14px;width:100%;}
  .searchbar input:focus{outline:none;}

  /* ---------- PRODUCT GRID ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s;
    cursor:pointer;
  }
  .card:hover{border-color:var(--energy);}
  .card-media{
    aspect-ratio:1/0.9;background:linear-gradient(150deg,var(--panel-alt),#101014);
    position:relative;display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);
  }
  .card-media svg{width:58%;opacity:0.92;}
  .badge{
    position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;
    padding:4px 9px;border-radius:100px;letter-spacing:0.02em;
  }
  .badge-new{background:var(--mint);color:#03211a;}
  .badge-best{background:var(--gold);color:#241a03;}
  .badge-low{position:absolute;top:10px;right:10px;background:var(--energy);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:100px;}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-cat{font-size:11.5px;color:var(--muted);font-weight:700;}
  .card-name{font-size:16px;font-weight:800;}
  .card-price{font-size:17px;font-weight:800;color:var(--energy);margin-top:2px;}
  .card-price .old{color:var(--muted);font-weight:600;font-size:13px;text-decoration:line-through;margin-left:6px;}
  .card-stars{font-size:12px;color:var(--gold);}
  .card-stars .n{color:var(--muted);font-weight:600;margin-left:4px;}
  .card-foot{padding:0 16px 16px;display:flex;gap:8px;}
  .card-foot .btn{flex:1;padding:11px;font-size:13px;}

  .empty-state{
    padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);
  }

  /* ---------- FIDELITE ---------- */
  .loyalty-section{
    background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .loyalty-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
  @media(max-width:860px){.loyalty-grid{grid-template-columns:1fr;}}
  .loyalty-tiers{display:flex;flex-direction:column;gap:14px;}
  .tier{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;background:var(--panel-alt);border:1px solid var(--line);border-radius:var(--radius);
  }
  .tier b{font-family:'Anton';font-size:15px;}
  .tier span{font-size:12.5px;color:var(--muted);}
  .savings-box{
    background:var(--panel-alt);border:1px solid var(--gold);border-radius:var(--radius);padding:22px;
  }
  .savings-box .amt{font-family:'Anton';font-size:36px;color:var(--gold);}

  /* ---------- SOCIAL PROOF ---------- */
  .proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media(max-width:860px){.proof-grid{grid-template-columns:1fr;}}
  .testi{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;
  }
  .testi .stars{color:var(--gold);font-size:14px;margin-bottom:10px;}
  .testi p{font-size:14.5px;color:var(--text);}
  .testi .who{margin-top:14px;font-size:13px;color:var(--muted);font-weight:700;}

  /* ---------- ABOUT ---------- */
  .about-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:48px;align-items:center;}
  @media(max-width:860px){.about-grid{grid-template-columns:1fr;}}
  .about-grid p{color:var(--muted);margin-top:14px;font-size:15px;max-width:56ch;}
  .badges-row{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap;}
  .mini-badge{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--text);}
  .mini-badge .dot{width:34px;height:34px;border-radius:50%;background:var(--panel-alt);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mint);flex-shrink:0;}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line);padding:52px 0 28px;background:var(--panel);}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px;}
  @media(max-width:700px){.footer-grid{grid-template-columns:1fr;}}
  .footer-grid h4{font-size:13px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:14px;}
  .footer-grid ul li{margin-bottom:9px;font-size:14px;}
  .footer-grid ul li a:hover{color:var(--energy);}
  .footer-bottom{
    margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:10px;
  }
  .admin-link{opacity:0.35;font-size:11.5px;}
  .admin-link:hover{opacity:1;}

  /* ---------- MODALS / DRAWERS ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);
    background:var(--bg);border-left:1px solid var(--line);z-index:210;
    transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 22px;border-bottom:1px solid var(--line);
  }
  .drawer-head h3{font-size:20px;}
  .drawer-body{flex:1;overflow-y:auto;padding:20px 22px;}
  .drawer-foot{padding:20px 22px;border-top:1px solid var(--line);}

  .cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .cart-item .thumb{width:64px;height:64px;background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cart-item .thumb svg{width:70%;}
  .cart-item .info{flex:1;}
  .cart-item .info .nm{font-weight:800;font-size:14px;}
  .cart-item .info .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .qty-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .qty-btn{width:24px;height:24px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .cart-item .rm{color:var(--energy);font-size:12px;font-weight:700;margin-top:8px;display:inline-block;}
  .cart-summary-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--muted);}
  .cart-summary-row.total{color:var(--text);font-weight:800;font-size:17px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .promo-row{display:flex;gap:8px;margin:14px 0;}
  .promo-row input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13px;}
  .points-bar{background:var(--panel);border:1px solid var(--line);border-radius:100px;height:8px;overflow:hidden;margin:8px 0;}
  .points-fill{height:100%;background:var(--gold);}

  .modal{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    width:min(920px,92vw);max-height:88vh;overflow-y:auto;z-index:220;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
  .modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;background:var(--panel);border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:2;}
  .pd-grid{display:grid;grid-template-columns:1fr 1fr;}
  @media(max-width:700px){.pd-grid{grid-template-columns:1fr;}}
  .pd-media{background:linear-gradient(150deg,var(--panel-alt),#101014);display:flex;align-items:center;justify-content:center;padding:40px;border-right:1px solid var(--line);}
  .pd-media svg{width:80%;}
  .pd-info{padding:32px;}
  .pd-info h3{font-size:26px;margin-bottom:8px;}
  .pd-price{font-size:22px;color:var(--energy);font-weight:800;margin:10px 0;}
  .pd-desc{color:var(--muted);font-size:14.5px;margin:14px 0;}
  .size-row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;}
  .size-chip{padding:8px 14px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-weight:700;}
  .size-chip.sel{border-color:var(--energy);background:rgba(255,67,34,0.1);}
  .stock-note{font-size:13px;color:var(--energy);font-weight:700;margin:10px 0;}

  /* checkout */
  .form-field{margin-bottom:14px;}
  .form-field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:700;}
  .form-field input,.form-field textarea,.form-field select{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;
    color:var(--text);font-family:inherit;font-size:14px;
  }
  .form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--energy);}
  .pay-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
  .pay-opt{
    border:1px solid var(--line);border-radius:4px;padding:14px;text-align:left;font-size:13px;font-weight:700;
    display:flex;flex-direction:column;gap:4px;
  }
  .pay-opt span{color:var(--muted);font-weight:500;font-size:11.5px;}
  .pay-opt.sel{border-color:var(--gold);background:rgba(214,169,74,0.08);}
  .paycode-box{background:var(--panel);border:1px solid var(--gold);border-radius:4px;padding:16px;margin-top:12px;font-size:13.5px;display:none;}
  .paycode-box.show{display:block;}
  .paycode-box b{color:var(--gold);}

  /* toasts */
  #toast-wrap{position:fixed;bottom:20px;left:20px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:320px;}
  .toast{
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--mint);
    border-radius:4px;padding:14px 16px;font-size:13px;
    animation:toastIn .3s ease, toastOut .3s ease 4.6s forwards;
  }
  .toast b{display:block;margin-bottom:2px;}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}

  /* welcome modal */
  #welcome-modal .pd-info{padding:40px;text-align:center;}
  #welcome-modal .code-display{
    font-family:'Anton';font-size:28px;letter-spacing:0.05em;color:var(--gold);
    border:2px dashed var(--gold);padding:14px;border-radius:6px;margin:18px 0;
  }

  /* install banner */
  #install-banner{
    position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);
    padding:14px 20px;display:none;align-items:center;justify-content:space-between;gap:14px;z-index:150;
  }
  #install-banner.show{display:flex;}

  /* ---------- ADMIN ---------- */
  #admin-view{display:none;min-height:100vh;padding:30px 0 80px;}
  #admin-view.show{display:block;}
  #site-view.hide{display:none;}
  .admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:12px;}
  .admin-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .admin-tab{padding:9px 16px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-weight:700;color:var(--muted);}
  .admin-tab.active{color:var(--text);border-color:var(--energy);background:rgba(255,67,34,0.08);}
  .admin-panel{display:none;}
  .admin-panel.show{display:block;}
  .admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .admin-table th,.admin-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;}
  .admin-table th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;}
  .admin-form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:26px;}
  .admin-form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:700px){.admin-form .grid2{grid-template-columns:1fr;}}
  .row-actions button{font-size:12px;font-weight:700;margin-right:10px;}
  .row-actions .del{color:var(--energy);}
  .toggle-chip{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:800;border:1px solid var(--line);}
  .toggle-chip.on{border-color:var(--mint);color:var(--mint);}
  #login-gate{
    max-width:380px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:32px;text-align:center;
  }
</head>
<body>

<div id="toast-wrap"></div>

<!-- ================= SITE VIEW ================= -->
<div id="site-view">

<header>
  <div class="header-row">
    <a href="#home" class="logo">SHOES<span>·</span>EMPIRE</a>
    <nav class="mainnav">
      <a href="#home">Accueil</a>
      <a href="#catalogue">Catalogue</a>
      <a href="#nouveautes">Nouveautés</a>
      <a href="#fidelite">Fidélité</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" onclick="openCart()" aria-label="Panier">
        🛒<span class="cart-count" id="cart-count">0</span>
      </button>
      <button class="icon-btn burger" onclick="toggleMobileNav()" aria-label="Menu">☰</button>
    </div>
  </div>

<div id="admin-view">
  <div id="login-gate">
    <h3 style="font-size:22px;margin-bottom:14px;">Espace admin</h3>

    <p id="login-error" style="color:var(--energy);font-size:12.5px;margin-top:10px;display:none;">Mot de passe incorrect.</p>
    <button class="btn btn-ghost btn-full" style="margin-top:10px;" onclick="closeAdmin()">Retour au site</button>
  </div>

  <div id="admin-dashboard" style="display:none;" class="wrap">
    <div class="admin-head">
      <h2 style="font-family:'Anton';font-size:26px;">Tableau de bord</h2>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost btn-sm" onclick="closeAdmin()">← Voir le site</button>
        <button class="btn btn-ghost btn-sm" onclick="logoutAdmin()">Déconnexion</button>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="produits" onclick="switchAdminTab('produits')">Produits</button>
      <button class="admin-tab" data-tab="promos" onclick="switchAdminTab('promos')">Codes promo</button>
      <button class="admin-tab" data-tab="avis" onclick="switchAdminTab('avis')">Avis clients</button>
      <button class="admin-tab" data-tab="stats" onclick="switchAdminTab('stats')">Statistiques</button>
    </div>

    <!-- PRODUITS -->
    <div class="admin-panel show" id="tab-produits">
      <div class="admin-form">
        <h3 style="font-size:16px;margin-bottom:14px;" id="product-form-title">Ajouter un produit</h3>
        <input type="hidden" id="p-id">
        <div class="grid2">
          <div class="form-field"><label>Nom du produit</label><input id="p-name" placeholder="Ex: Air Runner 90"></div>
          <div class="form-field"><label>Catégorie</label>
            <select id="p-cat">
              <option>Homme</option><option>Femme</option><option>Enfant</option><option>Unisexe</option>
            </select>
          </div>
          <div class="form-field"><label>Prix (FCFA)</label><input id="p-price" type="number" placeholder="25000"></div>
          <div class="form-field"><label>Prix barré (optionnel)</label><input id="p-oldprice" type="number" placeholder="30000"></div>
          <div class="form-field"><label>Stock disponible</label><input id="p-stock" type="number" placeholder="5"></div>
          <div class="form-field"><label>Tailles (séparées par virgule)</label><input id="p-sizes" placeholder="40,41,42,43"></div>
        </div>
        <div class="form-field"><label>Description</label><textarea id="p-desc" rows="3" placeholder="Décris le produit..."></textarea></div>
        <div style="display:flex;gap:20px;margin:10px 0 16px;">
          <label style="font-size:13px;display:flex;gap:6px;align-items:center;"><input type="checkbox" id="p-new"> Nouveauté</label>
          <label style="font-size:13px;display:flex;gap:6px;align-items:center;"><input type="checkbox" id="p-best"> Meilleure vente</label>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary" onclick="saveProduct()">Enregistrer</button>
          <button class="btn btn-ghost" onclick="resetProductForm()">Annuler</button>
        </div>
      </div>
      <table class="admin-table">
        <thead><tr><th>Produit</th><th>Prix</th><th>Stock</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody id="admin-product-rows"></tbody>
      </table>
    </div>

    <!-- PROMOS -->
    <div class="admin-panel" id="tab-promos">
      <div class="admin-form">
        <h3 style="font-size:16px;margin-bottom:14px;">Ajouter un code promo</h3>
        <div class="grid2">
          <div class="form-field"><label>Code</label><input id="promo-code" placeholder="BIENVENUE10"></div>
          <div class="form-field"><label>Réduction (%)</label><input id="promo-pct" type="number" placeholder="10"></div>
        </div>
        <button class="btn btn-primary" onclick="savePromo()">Ajouter</button>
      </div>
      <table class="admin-table">
        <thead><tr><th>Code</th><th>Réduction</th><th>Actions</th></tr></thead>
        <tbody id="admin-promo-rows"></tbody>
      </table>
    </div>

    <!-- AVIS -->
    <div class="admin-panel" id="tab-avis">
      <div class="admin-form">
        <h3 style="font-size:16px;margin-bottom:14px;">Ajouter un avis client</h3>
        <div class="grid2">
          <div class="form-field"><label>Nom du client</label><input id="t-name" placeholder="Ex: Rachidi B."></div>
          <div class="form-field"><label>Note (1 à 5)</label><input id="t-stars" type="number" min="1" max="5" placeholder="5"></div>
        </div>
        <div class="form-field"><label>Avis</label><textarea id="t-text" rows="2" placeholder="Ce que le client a dit..."></textarea></div>
        <button class="btn btn-primary" onclick="saveTestimonial()">Ajouter</button>
      </div>
      <table class="admin-table">
        <thead><tr><th>Client</th><th>Note</th><th>Avis</th><th>Actions</th></tr></thead>
        <tbody id="admin-testi-rows"></tbody>
      </table>
    </div>

    <!-- STATS -->
    <div class="admin-panel" id="tab-stats">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
        <div class="card" style="padding:20px;"><div style="font-size:12px;color:var(--muted);font-weight:700;">Visites du site</div><div style="font-family:'Anton';font-size:32px;margin-top:6px;" id="stat-visits">0</div></div>
        <div class="card" style="padding:20px;"><div style="font-size:12px;color:var(--muted);font-weight:700;">Ajouts au panier</div><div style="font-family:'Anton';font-size:32px;margin-top:6px;" id="stat-cartadds">0</div></div>
        <div class="card" style="padding:20px;"><div style="font-size:12px;color:var(--muted);font-weight:700;">Commandes envoyées</div><div style="font-family:'Anton';font-size:32px;margin-top:6px;" id="stat-orders">0</div></div>
        <div class="card" style="padding:20px;"><div style="font-size:12px;color:var(--muted);font-weight:700;">Produits en catalogue</div><div style="font-family:'Anton';font-size:32px;margin-top:6px;" id="stat-products">0</div></div>
      </div>
      <p style="color:var(--muted);font-size:13px;margin-top:18px;">Ces chiffres sont réels, mesurés sur cet appareil/navigateur. Pour un suivi complet multi-appareils, une base de données serait nécessaire (voir README).</p>
    </div>
  </div>
</div>
<!-- ================= /ADMIN VIEW ================= -->
